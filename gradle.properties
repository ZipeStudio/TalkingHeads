# # # # # # # # # # # # # #
#    Gradle Properties    #
# # # # # # # # # # # # # #

# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx10G
org.gradle.parallel=true

# Mossy Plugin
mossy_plugin_version = 3.12.0

# Mod Properties
data.mod_id = talkingheads
data.mod_slug = talkingheads
data.mod_jar_name = talking-heads
data.mod_name = Talking Heads
data.mod_version = 1.1.3
data.mod_group = me.zipestudio.talkingheads
data.mod_maven_group = me.zipestudio
data.mixin_configs = none
data.sides = client

data.mod_description = Client-side Addon for Plasmo Voice & Simple Voice Chat, that scales player heads when they're talking.
data.mod_authors = ZipeStudio
data.github_author = ZipeStudio
data.mod_license = CC-BY-ND 4.0

# Base Properties
base.lombok_version = 1.18.42
base.mixinextras_version = 0.4.1
base.mixin_version = 0.8.5

# Multi-Versions Properties
# Verified version: 1.20.1 1.20.4 1.21 1.21.1 1.21.2 1.21.3 1.21.4 1.21.5 1.21.6 1.21.7 1.21.8
fabric.multi_versions = 1.20.1 1.21.1 1.21.4 1.21.5 1.21.8 1.21.10 1.21.11 26.1 26.2
neoforge.multi_versions = 1.21.1 1.21.4 1.21.5 1.21.8 1.21.10 1.21.11 26.1 26.2
forge.multi_versions = 1.20.1

# Mod Loaders
mod_loaders = fabric neoforge forge

# Dependencies
build.fabric_loader = 0.17.2
build.fabric_api = [VERSIONED]
build.neoforge = [VERSIONED]
build.parchment = [VERSIONED]

# Additional Dependencies, "dep." is important
dep.yacl = [VERSIONED]
dep.modmenu = [VERSIONED]
dep.plasmo-voice = [VERSIONED]
dep.simple-voice-chat = [VERSIONED]

# # # # # # # # # # # # # #
#  Publication Properties #
# # # # # # # # # # # # # #

# Versions Specifications
fabric.versions_specifications = 1.21.10 26.1[26.1.2]
neoforge.versions_specifications = 1.21.10 26.1[26.1.2]
forge.versions_specifications = 1.20.1

# Version Type [RELEASE, BETA, ALPHA]
version_type = RELEASE

# Imitation of Publishing. Set to "true" for testing
test_publish = false

# Project IDs
modrinth_id = Os35nfkh
curseforge_id = 1108100

# CurseForge Settings
is_for_client = true
is_for_server = false
max_java_version = 21

# Fabric Mod Depends
fabric.depends_requires = fabric-api
fabric.depends_optional = modmenu yacl plasmo-voice simple-voice-chat
fabric.depends_incompatible = none
fabric.depends_embeds = none

# NeoForge Mod Depends
neoforge.depends_requires = none
neoforge.depends_optional = yacl plasmo-voice simple-voice-chat
neoforge.depends_incompatible = none
neoforge.depends_embeds  = none

# Forge Dependencies
forge.depends_requires = none
forge.depends_optional = yacl plasmo-voice simple-voice-chat
forge.depends_incompatible = none
forge.depends_embeds  = none

# Stonecutter Stuff
dev.kikugie.stonecutter.hard_mode=true
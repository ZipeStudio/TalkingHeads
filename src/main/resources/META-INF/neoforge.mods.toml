license = "${mod_license}"
issueTrackerURL = "https://github.com/ZipeStudio/${mod_id}"
modLoader="javafml"
loaderVersion="[1,)"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
side="${neoforge_trick_side}"
displayURL = "https://modrinth.com/mod/${mod_id}"
logoFile = "icon/icon.png"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId="yet_another_config_lib_v3"
type = "optional"
versionRange="[${yacl},)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="voicechat_api"
type = "optional"
versionRange="[${simple_voice_chat},)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="plasmovoice"
type = "optional"
versionRange="[${plasmo_voice},)"
ordering="AFTER"
side="CLIENT"